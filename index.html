<title>İlyas Sener | Kalemin Dilinden</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --text:#e8eaed;
    --muted:#9aa0a6; --accent:#c9a227; --accent2:#e0b84c; --border:#2a2f3a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background: url('arkaplan.jpg') no-repeat center center fixed;
    background-size: cover;
    color:var(--text);
    display:flex;
    min-height:100vh;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
  }
  
  a{color:inherit;text-decoration:none}

  /* ===== LOGO ALANI ===== */
  .logo-area{
    text-align:center; padding:30px 20px 20px; border-bottom:1px solid var(--border); margin-bottom:10px;
  }
  .logo-area img{
    width: 140px; height: 140px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--accent); box-shadow: 0 0 20px rgba(201,162,39,.4);
    background: #000;
  }
  .logo-title{
    font-size: 1.5rem; letter-spacing: 2px; color: var(--accent2); margin-top: 15px; font-weight: 600;
    text-transform: uppercase;
  }
  .logo-subtitle{
    font-size: 0.8rem; letter-spacing: 3px; color: var(--muted); margin-top: 5px; text-transform: uppercase;
  }

  /* ===== KENAR ÇUBUĞU (MASAÜSTÜ) ===== */
  aside{
    width:280px; 
    background: #0f1115; 
    border-right:1px solid var(--border);
    padding:0 0 24px 0;
    position:fixed; top:0; bottom:0; overflow-y:auto; transition:transform .3s; z-index:990;
  }
  .nav-group{margin-bottom:8px}
  .nav-group > span{display:block;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;color:var(--accent2);padding:15px 24px 6px; font-weight: 600;}
  .nav-group a{display:block;padding:9px 24px;font-size:.9rem;color:var(--text);border-left:3px solid transparent;transition:.2s}
  .nav-group a:hover, .nav-group a.active-link{background:rgba(30, 34, 43, 0.55);border-left-color:var(--accent);color:var(--accent2)}

  /* ===== İÇERİK ===== */
  main{margin-left:280px;flex:1;padding:40px;max-width:1100px}
  .page{display:none;animation:fade .35s ease}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  h2{font-size:1.9rem;margin-bottom:8px;color:var(--accent)}
  
  h2 + .sub{color:var(--accent2);margin-bottom:28px;font-size:.95rem; font-weight: 500;}
  
  /* Kartlara hafif koyu cam efekti */
  .card{
    background: rgba(15, 17, 21, 0.78); 
    backdrop-filter: blur(5px);
    border: 1px solid rgba(201, 162, 39, 0.25); 
    border-radius: 12px; 
    padding: 22px; 
    margin-bottom: 18px; 
    transition: .3s;
    text-shadow: none;
  }
  .card.highlight-card{
    border-color: var(--accent2);
    box-shadow: 0 0 18px rgba(224, 184, 76, 0.45);
  }
  .card h3{font-size:1.1rem;margin-bottom:8px; color: var(--accent2);}
  .card p{color:#cccccc;font-size:.9rem;line-height:1.6; font-weight: 400;}
  
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .badge{display:inline-block;background:rgba(30, 34, 43, 0.6);border:1px solid var(--border);color:var(--accent2);font-size:.72rem;padding:3px 10px;border-radius:20px;margin:0 6px 6px 0}
  
  .btn{display:inline-block;background:rgba(201, 162, 39, 0.12);color:var(--accent2);font-weight:600;padding:9px 18px;border-radius:8px;margin-top:12px;font-size:.88rem;border:1px solid var(--accent);cursor:pointer; text-shadow: none; transition: 0.2s;}
  .btn:hover{background:var(--accent); color:#111;}
  .btn.ghost{background:rgba(15, 17, 21, 0.5);color:var(--accent2);border:1px solid var(--accent)}

  .mini-input, .mini-select{
    width:100%; background:#1e222b; border:1px solid #444; border-radius:8px;
    padding:9px 11px; color:#fff; font-size:0.9rem; margin-top:10px; font-family:inherit;
  }
  .mini-list{list-style:none; margin-top:12px; display:flex; flex-direction:column; gap:8px;}
  .mini-list li{
    background:#171a21; border:1px solid #2a2f3a; border-radius:8px;
    padding:8px 12px; font-size:0.85rem; color:#e8eaed;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .durum-notu{margin-top:10px; font-size:0.82rem; color:#7cd992; min-height:18px;}

  .yonetici-bar{
    background:rgba(23, 26, 33, 0.92); border:1px solid rgba(201, 162, 39, 0.4);
    border-radius:12px; padding:16px 20px; margin-top:28px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
    text-shadow:none;
  }
  .admin-only-box{display:none; margin-top:12px;}
  body.admin-active .admin-only-box{display:block;}

  /* İletişim formu alanları */
  #iletisim form input, #iletisim form textarea{
    width:100%; background:#1e222b; border:1px solid #444; border-radius:8px;
    padding:12px; color:#fff; font-size:15px; margin-bottom:12px; font-family:inherit;
  }
  #iletisim form textarea{min-height:100px; resize:vertical;}

  .iletisim-liste{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
  .iletisim-liste a{
    color:#e8eaed; background:#171a21; padding:11px 16px; border-radius:8px;
    border:1px solid #2a2f3a; font-size:0.92rem; display:block;
  }
  .iletisim-liste a:hover{border-color:var(--accent); color:var(--accent2);}
  
  /* ===== PROFİL DÜZENLEME FORMU STİLLERİ ===== */
  .profil-form-kapsayici {
      background-color: var(--panel);
      border: 1px solid rgba(201, 162, 39, 0.3); 
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(201, 162, 39, 0.1);
      max-width: 800px;
      text-shadow: none;
  }
  .form-grubu { display: flex; gap: 20px; flex-wrap: wrap; }
  .form-alani { flex: 1; min-width: 250px; display: flex; flex-direction: column; margin-bottom: 20px; }
  .form-alani label { margin-bottom: 8px; font-size: 14px; color: #cccccc; font-weight: 500; }
  .form-alani input, .form-alani textarea, .form-alani select {
      background-color: #2a2a2a; border: 1px solid #444; border-radius: 8px;
      padding: 12px; color: white; font-size: 15px; transition: all 0.3s ease;
  }
  .form-alani input:focus, .form-alani textarea:focus, .form-alani select:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 8px rgba(201, 162, 39, 0.3);
  }
  .form-alani textarea { resize: vertical; min-height: 100px; font-family: inherit; }
  .kaydet-buton {
      background-color: transparent; color: var(--accent); border: 2px solid var(--accent);
      padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 8px;
      cursor: pointer; transition: all 0.3s ease; letter-spacing: 1px;
  }
  .kaydet-buton:hover { background-color: var(--accent); color: #111; box-shadow: 0 0 15px rgba(201, 162, 39, 0.5); }

  /* ===== BÖLÜM / İŞLEM PENCERESİ (MODAL) ===== */
  .modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75);
    z-index:2000; align-items:center; justify-content:center; padding:20px;
  }
  .modal-backdrop.active{display:flex;}
  .modal-box{
    background:#171a21; border:1px solid var(--accent); border-radius:14px;
    max-width:520px; width:100%; padding:26px; box-shadow:0 15px 40px rgba(0,0,0,0.85);
    text-shadow:none;
  }
  .modal-box h3{color:var(--accent2); font-size:1.3rem; margin-bottom:10px;}
  .modal-box p{color:#d4d7dd; font-size:0.95rem; line-height:1.6; margin-bottom:18px;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;}

  /* ===== MOBİL UYUMLULUK ===== */
  .menu-btn{display:none;position:fixed;top:16px;left:16px;z-index:1001;background:var(--accent);color:#111;border:none;width:44px;height:44px;border-radius:10px;font-size:1.3rem;cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,.5); text-shadow: none;}
  .menu-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:995;}
  .menu-backdrop.active{display:block;}
